services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: coperativa-prod
    ports:
      - "3000:3000"
    volumes:
      - coperativa-data:/app/.next/standalone
    environment:
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - NEXTAUTH_URL=${NEXTAUTH_URL}
      - DATABASE_URL=file:/app/.next/standalone/dev.db
    env_file:
      - .env.local

volumes:
  coperativa-data: