services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: coperativa-dev
    volumes:
      - .:/app
      - /app/node_modules
      - coperativa-dev-db:/app/prisma
    ports:
      - "3000:3000"
    env_file:
      - .env.local
    environment:
      - WATCHPACK_POLLING=true
    stdin_open: true
    tty: true

volumes:
  coperativa-dev-db: